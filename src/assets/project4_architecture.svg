<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 820" width="100%" height="100%" style="background:#090d16; font-family: ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;">
  <defs>
    <!-- Gradients -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0f1d"/>
      <stop offset="100%" stop-color="#060911"/>
    </linearGradient>
    <linearGradient id="cardGradDark" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#111827" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0.9"/>
    </linearGradient>
    <linearGradient id="emeraldGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#10b981"/>
      <stop offset="100%" stop-color="#059669"/>
    </linearGradient>
    <linearGradient id="cyanGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#06b6d4"/>
      <stop offset="100%" stop-color="#0284c7"/>
    </linearGradient>
    <linearGradient id="amberGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#d97706"/>
    </linearGradient>
    <linearGradient id="purpleGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#8b5cf6"/>
      <stop offset="100%" stop-color="#6366f1"/>
    </linearGradient>

    <!-- Drop Shadows & Glows -->
    <filter id="glowEmerald" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#10b981" flood-opacity="0.25"/>
    </filter>
    <filter id="glowCyan" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#06b6d4" flood-opacity="0.25"/>
    </filter>
    <filter id="glowAmber" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#f59e0b" flood-opacity="0.2"/>
    </filter>
    <filter id="shadowCard" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="6" stdDeviation="10" flood-color="#000000" flood-opacity="0.5"/>
    </filter>

    <!-- Markers -->
    <marker id="arrowEmerald" markerWidth="10" markerHeight="8" refX="8" refY="4" orient="auto">
      <polygon points="0 0, 10 4, 0 8" fill="#10b981"/>
    </marker>
    <marker id="arrowCyan" markerWidth="10" markerHeight="8" refX="8" refY="4" orient="auto">
      <polygon points="0 0, 10 4, 0 8" fill="#06b6d4"/>
    </marker>
    <marker id="arrowAmber" markerWidth="10" markerHeight="8" refX="8" refY="4" orient="auto">
      <polygon points="0 0, 10 4, 0 8" fill="#f59e0b"/>
    </marker>
    <marker id="arrowPurple" markerWidth="10" markerHeight="8" refX="8" refY="4" orient="auto">
      <polygon points="0 0, 10 4, 0 8" fill="#a78bfa"/>
    </marker>
    <marker id="arrowSlate" markerWidth="10" markerHeight="8" refX="8" refY="4" orient="auto">
      <polygon points="0 0, 10 4, 0 8" fill="#64748b"/>
    </marker>
  </defs>

  <!-- Background Base -->
  <rect width="1200" height="820" fill="url(#bgGrad)"/>
  
  <!-- Subtle Grid Pattern -->
  <g opacity="0.07">
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#94a3b8" stroke-width="0.8"/>
    </pattern>
    <rect width="1200" height="820" fill="url(#grid)"/>
  </g>

  <!-- Header Section -->
  <g transform="translate(60, 45)">
    <rect x="0" y="0" width="180" height="26" rx="13" fill="#10b981" fill-opacity="0.12" stroke="#10b981" stroke-opacity="0.3" stroke-width="1"/>
    <text x="90" y="17" fill="#34d399" font-size="12" font-weight="600" font-family="monospace" text-anchor="middle" letter-spacing="1">SYSTEM ARCHITECTURE</text>
    
    <text x="0" y="58" fill="#ffffff" font-size="24" font-weight="700">Distributed URL Shortener &amp; Redirection Engine</text>
    <text x="0" y="80" fill="#94a3b8" font-size="14">Multi-Tier In-Memory Buffering (0ms) • Bloom Filter DDoS Defense • Sub-ms Redis Caching</text>
  </g>

  <!-- Top Badges / KPI Highlights -->
  <g transform="translate(750, 42)">
    <g transform="translate(0, 0)">
      <rect width="110" height="42" rx="8" fill="#1e293b" stroke="#334155" stroke-width="1"/>
      <text x="55" y="18" fill="#34d399" font-size="14" font-weight="700" text-anchor="middle">~0 ms</text>
      <text x="55" y="32" fill="#94a3b8" font-size="10" text-anchor="middle">Key Acquisition</text>
    </g>
    <g transform="translate(125, 0)">
      <rect width="110" height="42" rx="8" fill="#1e293b" stroke="#334155" stroke-width="1"/>
      <text x="55" y="18" fill="#38bdf8" font-size="14" font-weight="700" text-anchor="middle">~0.5 ms</text>
      <text x="55" y="32" fill="#94a3b8" font-size="10" text-anchor="middle">Read Latency</text>
    </g>
    <g transform="translate(250, 0)">
      <rect width="140" height="42" rx="8" fill="#1e293b" stroke="#334155" stroke-width="1"/>
      <text x="70" y="18" fill="#a78bfa" font-size="14" font-weight="700" text-anchor="middle">0 DB Reads</text>
      <text x="70" y="32" fill="#94a3b8" font-size="10" text-anchor="middle">DDoS Dropped (k=5)</text>
    </g>
  </g>

  <!-- ========================================== -->
  <!-- SECTION 1: WRITE PATH (URL CREATION)       -->
  <!-- ========================================== -->
  <g transform="translate(60, 160)">
    <!-- Container Box -->
    <rect width="510" height="370" rx="14" fill="url(#cardGradDark)" stroke="#10b981" stroke-opacity="0.3" stroke-width="1.5" filter="url(#shadowCard)"/>
    <rect x="0" y="0" width="510" height="38" rx="14" fill="#064e3b" fill-opacity="0.25"/>
    <circle cx="24" cy="19" r="6" fill="#10b981"/>
    <text x="40" y="23" fill="#34d399" font-size="13" font-weight="700" letter-spacing="0.5">WRITE PATH: HIGH-CONCURRENCY URL CREATION</text>

    <!-- Client Write Step -->
    <g transform="translate(25, 60)">
      <rect width="130" height="60" rx="8" fill="#1e293b" stroke="#38bdf8" stroke-width="1.2"/>
      <text x="65" y="26" fill="#38bdf8" font-size="12" font-weight="700" text-anchor="middle">Client Request</text>
      <text x="65" y="44" fill="#94a3b8" font-size="10" font-family="monospace" text-anchor="middle">POST /api/urls</text>
    </g>

    <!-- Arrow Client -> Express -->
    <path d="M 155 90 L 195 90" fill="none" stroke="#38bdf8" stroke-width="2" marker-end="url(#arrowCyan)"/>

    <!-- Express API Instance -->
    <g transform="translate(205, 55)">
      <rect width="155" height="70" rx="8" fill="#0f172a" stroke="#10b981" stroke-width="1.5" filter="url(#glowEmerald)"/>
      <text x="77" y="26" fill="#ffffff" font-size="12" font-weight="700" text-anchor="middle">Express API Instance</text>
      <text x="77" y="43" fill="#34d399" font-size="11" font-weight="600" text-anchor="middle">TokenBuffer (~0ms)</text>
      <text x="77" y="58" fill="#94a3b8" font-size="9" text-anchor="middle">Local In-Memory Ring</text>
    </g>

    <!-- Token Buffer Callout Details -->
    <g transform="translate(390, 52)">
      <rect width="100" height="76" rx="6" fill="#1e293b" stroke="#334155" stroke-width="1"/>
      <text x="50" y="20" fill="#f59e0b" font-size="10" font-weight="700" text-anchor="middle">Zero Network Hop</text>
      <text x="50" y="38" fill="#94a3b8" font-size="9" text-anchor="middle">Serves write from</text>
      <text x="50" y="50" fill="#94a3b8" font-size="9" text-anchor="middle">RAM immediately</text>
      <text x="50" y="66" fill="#34d399" font-size="9" font-weight="600" text-anchor="middle">Fastest Latency</text>
    </g>

    <!-- Step 1 arrow down to persistence -->
    <path d="M 245 125 L 245 168 L 130 168 L 130 195" fill="none" stroke="#10b981" stroke-width="1.5" marker-end="url(#arrowEmerald)"/>
    <text x="175" y="162" fill="#34d399" font-size="10" font-weight="600" text-anchor="middle">1. Save Document</text>

    <!-- Step 2 arrow to Bloom Filter -->
    <path d="M 320 125 L 320 168 L 380 168 L 380 195" fill="none" stroke="#06b6d4" stroke-width="1.5" marker-end="url(#arrowCyan)"/>
    <text x="365" y="162" fill="#38bdf8" font-size="10" font-weight="600" text-anchor="middle">2. Register Key</text>

    <!-- MongoDB Urls Record -->
    <g transform="translate(50, 205)">
      <rect width="160" height="70" rx="8" fill="#1e293b" stroke="#10b981" stroke-width="1.2"/>
      <text x="80" y="26" fill="#10b981" font-size="12" font-weight="700" text-anchor="middle">MongoDB: Urls</text>
      <text x="80" y="44" fill="#94a3b8" font-size="10" text-anchor="middle">Permanent Storage</text>
      <text x="80" y="58" fill="#64748b" font-size="9" text-anchor="middle">Unique Indexed ShortCode</text>
    </g>

    <!-- Bloom Filter Registration -->
    <g transform="translate(300, 205)">
      <rect width="160" height="70" rx="8" fill="#1e293b" stroke="#06b6d4" stroke-width="1.2"/>
      <text x="80" y="26" fill="#06b6d4" font-size="12" font-weight="700" text-anchor="middle">Redis Bloom Filter</text>
      <text x="80" y="44" fill="#94a3b8" font-size="10" text-anchor="middle">bloom:urls (k=5)</text>
      <text x="80" y="58" fill="#38bdf8" font-size="9" text-anchor="middle">Add bit pattern instantly</text>
    </g>

    <!-- Failover Footer in Write Path -->
    <g transform="translate(25, 298)">
      <rect width="460" height="52" rx="8" fill="#182234" stroke="#334155" stroke-dasharray="3,3" stroke-width="1"/>
      <text x="20" y="22" fill="#fbbf24" font-size="11" font-weight="700">3-Tier Resilient Key Fallback Strategy:</text>
      <text x="20" y="40" fill="#94a3b8" font-size="10">Local TokenBuffer (RAM)  ⟶  Central Redis Key Pool  ⟶  Emergency Mongo Counter Lease</text>
    </g>
  </g>

  <!-- ========================================== -->
  <!-- SECTION 2: READ PATH (SUB-MS REDIRECTION)  -->
  <!-- ========================================== -->
  <g transform="translate(630, 160)">
    <!-- Container Box -->
    <rect width="510" height="370" rx="14" fill="url(#cardGradDark)" stroke="#06b6d4" stroke-opacity="0.3" stroke-width="1.5" filter="url(#shadowCard)"/>
    <rect x="0" y="0" width="510" height="38" rx="14" fill="#0c4a6e" fill-opacity="0.25"/>
    <circle cx="24" cy="19" r="6" fill="#06b6d4"/>
    <text x="40" y="23" fill="#38bdf8" font-size="13" font-weight="700" letter-spacing="0.5">READ PATH: HIGH-SPEED GATEWAY &amp; REDIRECTION</text>

    <!-- Client Read Step -->
    <g transform="translate(25, 60)">
      <rect width="130" height="60" rx="8" fill="#1e293b" stroke="#38bdf8" stroke-width="1.2"/>
      <text x="65" y="26" fill="#38bdf8" font-size="12" font-weight="700" text-anchor="middle">Client Read</text>
      <text x="65" y="44" fill="#94a3b8" font-size="10" font-family="monospace" text-anchor="middle">GET /:shortCode</text>
    </g>

    <!-- Arrow Client -> Express -->
    <path d="M 155 90 L 195 90" fill="none" stroke="#38bdf8" stroke-width="2" marker-end="url(#arrowCyan)"/>

    <!-- Gateway & Bloom Check -->
    <g transform="translate(205, 55)">
      <rect width="160" height="70" rx="8" fill="#0f172a" stroke="#06b6d4" stroke-width="1.5" filter="url(#glowCyan)"/>
      <text x="80" y="24" fill="#ffffff" font-size="12" font-weight="700" text-anchor="middle">Redis Bloom Filter</text>
      <text x="80" y="40" fill="#38bdf8" font-size="10" font-weight="600" text-anchor="middle">Multi-Hash Verification</text>
      <text x="80" y="56" fill="#94a3b8" font-size="9" text-anchor="middle">Kirsch-Mitzenmacher (k=5)</text>
    </g>

    <!-- Bloom Decision Branches -->
    <!-- Bit = 0: 404 Drop -->
    <path d="M 365 75 L 405 75" fill="none" stroke="#ef4444" stroke-width="1.5" marker-end="url(#arrowSlate)"/>
    <g transform="translate(415, 52)">
      <rect width="80" height="46" rx="6" fill="#450a0a" stroke="#ef4444" stroke-width="1"/>
      <text x="40" y="20" fill="#fca5a5" font-size="10" font-weight="700" text-anchor="middle">Bit = 0</text>
      <text x="40" y="34" fill="#f87171" font-size="9" text-anchor="middle">Instant 404 (0 DB)</text>
    </g>

    <!-- Bit = 1: Check Redis Cache -->
    <path d="M 285 125 L 285 155" fill="none" stroke="#06b6d4" stroke-width="2" marker-end="url(#arrowCyan)"/>
    <text x="335" y="145" fill="#38bdf8" font-size="10" font-weight="600">Bit = 1 (Exists)</text>

    <!-- Redis RAM Cache & Tombstone Check -->
    <g transform="translate(195, 165)">
      <rect width="180" height="68" rx="8" fill="#1e293b" stroke="#38bdf8" stroke-width="1.2"/>
      <text x="90" y="24" fill="#38bdf8" font-size="12" font-weight="700" text-anchor="middle">Redis RAM Cache</text>
      <text x="90" y="42" fill="#34d399" font-size="11" font-weight="600" text-anchor="middle">Hit: ~0.5ms Redirect</text>
      <text x="90" y="58" fill="#94a3b8" font-size="9" text-anchor="middle">Active URL or Negative Tombstone</text>
    </g>

    <!-- Cache Hit Arrow Left -->
    <path d="M 195 200 L 135 200" fill="none" stroke="#10b981" stroke-width="1.5" marker-end="url(#arrowEmerald)"/>
    <g transform="translate(25, 175)">
      <rect width="105" height="50" rx="6" fill="#064e3b" stroke="#10b981" stroke-width="1"/>
      <text x="52" y="22" fill="#34d399" font-size="10" font-weight="700" text-anchor="middle">Cache Hit</text>
      <text x="52" y="38" fill="#a7f3d0" font-size="9" text-anchor="middle">302 to Destination</text>
    </g>

    <!-- Cache Miss Arrow Down to MongoDB -->
    <path d="M 285 233 L 285 260" fill="none" stroke="#f59e0b" stroke-width="1.5" marker-end="url(#arrowAmber)"/>
    <text x="345" y="252" fill="#f59e0b" font-size="10">Cold Miss</text>

    <g transform="translate(180, 268)">
      <rect width="210" height="80" rx="8" fill="#1e293b" stroke="#f59e0b" stroke-width="1.2"/>
      <text x="105" y="22" fill="#f59e0b" font-size="11" font-weight="700" text-anchor="middle">MongoDB Indexed Query</text>
      <text x="105" y="38" fill="#94a3b8" font-size="10" text-anchor="middle">Fallback DB Read + Auto Write-Back</text>
      <text x="105" y="54" fill="#34d399" font-size="9" text-anchor="middle">Active: Cache with TTL</text>
      <text x="105" y="68" fill="#cbd5e1" font-size="9" text-anchor="middle">Expired: 24h Negative Tombstone</text>
    </g>
  </g>

  <!-- ========================================== -->
  <!-- SECTION 3: KEY GENERATION SERVICE & POOL   -->
  <!-- ========================================== -->
  <g transform="translate(60, 560)">
    <!-- Container Box -->
    <rect width="1080" height="215" rx="14" fill="url(#cardGradDark)" stroke="#8b5cf6" stroke-opacity="0.3" stroke-width="1.5" filter="url(#shadowCard)"/>
    <rect x="0" y="0" width="1080" height="38" rx="14" fill="#4c1d95" fill-opacity="0.25"/>
    <circle cx="24" cy="19" r="6" fill="#a78bfa"/>
    <text x="40" y="23" fill="#c4b5fd" font-size="13" font-weight="700" letter-spacing="0.5">BACKGROUND KEY GENERATION SERVICE (KGS) &amp; PERSISTENT ATOMIC RANGE LEASING</text>

    <!-- Step 1: MongoDB Atomic Counter -->
    <g transform="translate(35, 60)">
      <rect width="210" height="120" rx="10" fill="#1e293b" stroke="#10b981" stroke-width="1.2"/>
      <rect x="15" y="15" width="180" height="24" rx="4" fill="#064e3b" fill-opacity="0.4"/>
      <text x="105" y="31" fill="#34d399" font-size="11" font-weight="700" text-anchor="middle">MongoDB: Counter</text>
      <text x="105" y="62" fill="#ffffff" font-size="11" font-weight="600" text-anchor="middle">Atomic Range Leasing</text>
      <text x="105" y="80" fill="#94a3b8" font-size="10" text-anchor="middle">Leases 5,000 IDs per batch</text>
      <text x="105" y="102" fill="#34d399" font-size="10" font-weight="700" text-anchor="middle">Zero Collision Guarantee</text>
      <text x="105" y="118" fill="#64748b" font-size="9" text-anchor="middle">No write-lock contention</text>
    </g>

    <!-- Arrow Mongo -> KGS Worker -->
    <path d="M 245 120 L 305 120" fill="none" stroke="#10b981" stroke-width="2" marker-end="url(#arrowEmerald)"/>
    <text x="275" y="110" fill="#34d399" font-size="10" font-weight="600" text-anchor="middle">Batch</text>

    <!-- Step 2: KGS Daemon Worker -->
    <g transform="translate(315, 60)">
      <rect width="230" height="120" rx="10" fill="#1e293b" stroke="#8b5cf6" stroke-width="1.5" filter="url(#glowAmber)"/>
      <rect x="15" y="15" width="200" height="24" rx="4" fill="#4c1d95" fill-opacity="0.4"/>
      <text x="115" y="31" fill="#c4b5fd" font-size="11" font-weight="700" text-anchor="middle">KGS Background Daemon</text>
      <text x="115" y="62" fill="#ffffff" font-size="11" font-weight="600" text-anchor="middle">Sqids Base-62 Generator</text>
      <text x="115" y="80" fill="#94a3b8" font-size="10" text-anchor="middle">Bijective integer mapping</text>
      <text x="115" y="98" fill="#a78bfa" font-size="10" text-anchor="middle">Asynchronous background loop</text>
      <text x="115" y="118" fill="#34d399" font-size="9" font-weight="600" text-anchor="middle">Independent Worker Process</text>
    </g>

    <!-- Arrow KGS Worker -> Redis Key Pool -->
    <path d="M 545 120 L 605 120" fill="none" stroke="#8b5cf6" stroke-width="2" marker-end="url(#arrowPurple)"/>
    <text x="575" y="110" fill="#c4b5fd" font-size="10" font-weight="600" text-anchor="middle">RPUSH</text>

    <!-- Step 3: Redis Key Pool -->
    <g transform="translate(615, 60)">
      <rect width="220" height="120" rx="10" fill="#1e293b" stroke="#06b6d4" stroke-width="1.2"/>
      <rect x="15" y="15" width="190" height="24" rx="4" fill="#0c4a6e" fill-opacity="0.4"/>
      <text x="110" y="31" fill="#38bdf8" font-size="11" font-weight="700" text-anchor="middle">Redis: key_pool:available</text>
      <text x="110" y="62" fill="#ffffff" font-size="11" font-weight="600" text-anchor="middle">Central Key Pool</text>
      <text x="110" y="80" fill="#94a3b8" font-size="10" text-anchor="middle">Pre-generated Base-62 tokens</text>
      <text x="110" y="98" fill="#38bdf8" font-size="10" text-anchor="middle">Monitored with low-watermark</text>
      <text x="110" y="118" fill="#34d399" font-size="9" font-weight="600" text-anchor="middle">Ready for Immediate Draw</text>
    </g>

    <!-- Arrow Redis Key Pool -> TokenBuffer API -->
    <path d="M 835 120 L 895 120" fill="none" stroke="#06b6d4" stroke-width="2" marker-end="url(#arrowCyan)"/>
    <text x="865" y="110" fill="#38bdf8" font-size="10" font-weight="600" text-anchor="middle">LPOP</text>

    <!-- Step 4: Express API TokenBuffer Refill -->
    <g transform="translate(905, 60)">
      <rect width="145" height="120" rx="10" fill="#1e293b" stroke="#10b981" stroke-width="1.2"/>
      <rect x="10" y="15" width="125" height="24" rx="4" fill="#064e3b" fill-opacity="0.4"/>
      <text x="72" y="31" fill="#34d399" font-size="10" font-weight="700" text-anchor="middle">TokenBuffer RAM</text>
      <text x="72" y="62" fill="#ffffff" font-size="11" font-weight="600" text-anchor="middle">In-Process Buffer</text>
      <text x="72" y="80" fill="#94a3b8" font-size="10" text-anchor="middle">Local API ring buffer</text>
      <text x="72" y="98" fill="#34d399" font-size="11" font-weight="700" text-anchor="middle">~0ms Latency</text>
      <text x="72" y="118" fill="#94a3b8" font-size="9" text-anchor="middle">Zero write bottleneck</text>
    </g>
  </g>
</svg>
